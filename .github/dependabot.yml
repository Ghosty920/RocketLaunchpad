version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - javascript
    groups:
      tauri:
        patterns:
          - '@tauri-apps/*'
      node:
        patterns:
          - '*'
        exclude-patterns:
          - '@tauri-apps/*'

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    labels:
      - dependencies
      - rust
    groups:
      tauri:
        patterns:
          - 'tauri'
          - 'tauri-*'
      rust:
        patterns:
          - '*'
        exclude-patterns:
          - 'tauri'
          - 'tauri-*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
