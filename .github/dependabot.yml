version: 2

multi-ecosystem-groups:
  tauri:
    schedule:
      interval: weekly
    labels:
      - dependencies

updates:
  # Tauri dependencies
  - package-ecosystem: npm
    directory: /
    patterns:
      - '@tauri-apps/*'
    labels:
      - javascript
    multi-ecosystem-group: tauri

  - package-ecosystem: cargo
    directory: /src-tauri
    patterns:
      - 'tauri'
      - 'tauri-*'
    labels:
      - rust
    multi-ecosystem-group: tauri

  # Other dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - javascript
    groups:
      node:
        patterns:
          - '*'
        exclude-patterns:
          - '@tauri-apps/*'

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    labels:
      - dependencies
      - rust
    groups:
      rust:
        patterns:
          - '*'
        exclude-patterns:
          - 'tauri'
          - 'tauri-*'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
