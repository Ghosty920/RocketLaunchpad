name: Build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Extract metadata
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "GIT_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BUILD_MODE=production" >> $GITHUB_ENV
      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_STATS_WEBSITE_ID: ${{ secrets.VITE_STATS_WEBSITE_ID }}
          VITE_APP_VERSION: ${{ env.VERSION }}
          VITE_GIT_SHA: ${{ env.GIT_SHA_SHORT }}
          VITE_BUILD_MODE: ${{ env.BUILD_MODE }}
        with:
          tagName: v__VERSION__
          releaseName: Release v__VERSION__
          releaseDraft: false
          includeDebug: false
