changelog:
  categories:
    - title: '⚠️ Breaking Changes'
      labels:
        - 'breaking'
    - title: '🚀 Features'
      labels:
        - 'feature'
    - title: '🐛 Bug Fixes'
      labels:
        - 'fix'
        - 'bug'
    - title: '🧰 Maintenance'
      labels:
        - 'chore'
        - 'dependencies'
    - title: '📝 Documentation'
      labels:
        - 'documentation'
    - title: '📦 Other Changes'
      labels:
        - '*'
