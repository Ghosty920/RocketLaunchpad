[package]
name = "rocket-launchpad"
version = "1.0.0"
description = "A Rocket League launcher powered by Tauri"
authors = ["Ghosty"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rocket_launchpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4"
keyring-core = "1"
rand = "0.10"
hex = "0.4"
aes-gcm = "0.11"
getrandom = "0.4"
base64 = "0.23"
open = "5"
chrono = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
zstd = "0.13"
reqwest = { version = "0.13", features = ["json", "blocking", "stream", "rustls", "gzip", "brotli", "deflate", "zstd"] }
futures-util = "0.3"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Controls_Dialogs"] }
windows-native-keyring-store = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
